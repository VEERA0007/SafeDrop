name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|SDK location|not found|Could not" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafeDrop-Kids-apk
          path: kid/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafeDrop-Parent-apk
          path: parent/build/outputs/apk/debug/*.apk
